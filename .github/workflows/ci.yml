name: CI & Benchmarks

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check (rustfmt)
        run: cargo fmt --all -- --check
      - name: Strict Clippy lint gate (-D warnings across all 8 workspace crates)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run standalone crate isolation & end-to-end integration tests
        run: cargo test --workspace -- --test-threads=2 --nocapture
      - name: Build LTO-optimized single binary & verify doctor + deterministic benchmarks
        run: |
          cargo build --release --bin ap
          ./target/release/ap doctor
          ./target/release/ap bench --out bench/results.json
        shell: bash
