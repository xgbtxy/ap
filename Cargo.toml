[workspace]
resolver = "2"
members = [
    ".",
    "crates/ap-sieve",
    "crates/ap-baton",
    "crates/ap-recall",
    "crates/ap-guard",
    "crates/ap-atlas",
    "crates/ap-probe",
    "crates/ap-splice",
]

[workspace.package]
version = "2.69.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["xgbtxy <115146404+xgbtxy@users.noreply.github.com>"]
repository = "https://github.com/xgbtxy/ap"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
encoding_rs = "0.8"
flate2 = "1.0"
ignore = "0.4"
regex = "1.11"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[package]
name = "agent-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Execution engine built from real LLM <thinking> bottlenecks — eliminates blind reads, edit misses, Windows/macOS shell crashes & hung browser checks so coding agents finish 2x faster with zero slop"
default-run = "ap"

[[bin]]
name = "ap"
path = "src/main.rs"

[dependencies]
ap-atlas = { path = "crates/ap-atlas" }
ap-baton = { path = "crates/ap-baton" }
ap-guard = { path = "crates/ap-guard" }
ap-probe = { path = "crates/ap-probe" }
ap-recall = { path = "crates/ap-recall" }
ap-sieve = { path = "crates/ap-sieve" }
ap-splice = { path = "crates/ap-splice" }
base64.workspace = true
clap.workspace = true
csv.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
ignore.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
